<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @property --fill-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 360deg;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
	    background-color: oklch(20% 0.1 200);
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 10px;
        }

        .pixel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            
            background: conic-gradient(oklch(50% 0.15 20) var(--fill-angle), oklch(25% 0.1 200) 0);
            
            transition: --fill-angle 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>
</head>
<body>

    <div id="grid"></div>

    <script>
        const ROWS = 6;
        const COLS = 4;
        const M = ROWS * COLS;

        const grid = document.getElementById('grid');
        const pixels = [];

        for (let i = 0; i < M; i++) {
            const div = document.createElement('div');
            div.className = 'pixel';
            grid.appendChild(div);
            pixels.push(div);
        }
	const G = {
		fills: [
			0, 135, 135, 0,
			135, 270, 180, 45, 
			180, 180, 180, 90, 
			180, 180, 270, 180, 
			135, 270, 270, 135, 
			0, 135, 135, 0,
			],
		rotations: [
			90, 90, 135, 180,
			45, 180, -90, -90,
			0, 180, 90, 180,
			0, 180, -90, 180,
			0, 90, 0, 225,
			0, -45, -90, -90
		]
	}

	const E = {
		fills: [
			90, 180, 180, 90,
			180, 270, 180, 90, 
			180, 270, 90, 0, 
			180, 270, 90, 0, 
			180, 270, 180, 90, 
			90, 180, 180, 90,
			],
		rotations: [
			90, 90, 90, 180,
			0, 180, -90, -90,
			0, 90, 180, 180,
			0, 180, -90, -90,
			0, 90, 90, 180,
			0, -90, -90, -90


		]
	}

        const N ={
		fills: [	
			45, 0, 90, 90,
			180, 180, 180, 180,
			180, 360, 315, 180,
			180, 315, 360, 180,
			180, 180, 180, 180,
			90, 90, 0, 45
		],
		rotations: [
			135, 180, 90, 180,
			0, 135, 0, 180,
			0, 135, 0, 180,
			0, 180, 0, 180,
			0, 180, -45, 180,
			0, -90, 0, -45,
		],
        };
        const U ={
		fills: [	
			 90, 90, 90,  90,
			180, 180, 180, 180,
			180, 180, 180, 180,
			180, 180, 180, 180,
			135, 270, 270, 135,
			0, 135, 135, 0,
		],
		rotations: [
			90, 180, 90, 180,
			0, 180, -0, 180,
			0, 180, 0, 180,
			0, 180, 0, 180,
			0, 90, 0, 225,
			0, -45, -90, -90
		],
        };

        const A ={
		fills: [	
			 0, 135, 135,  0,
			135, 270, 270, 135,
			180, 180, 180, 180,
			180, 270, 270, 180,
			180, 270, 270, 180,
			90, 90, 90, 90
		],
		rotations: [
			90, 90, 135, 180,
			45, 180, -90, 180,
			0, 180, 0, 180,
			0, 90, 0, 180,
			0, 180, -90, 180,
			0, -90, 0, -90,
		],
        };

        const R = {
		fills: [	
			 90, 180, 135,  0,
			180, 270, 270, 135,
			180, 270, 270, 135,
			180, 360, 270, 0,
			180, 270, 270, 135,
			90, 90, 90, 90
		],
		rotations: [
			90, 90, 135, 180,
			0, 180, -90, 180,
			0, 90, 0, 225,
			0, 180, 135, 225,
			0, 180, -90, 180,
			0, -90, 0, -90,
		],
        };

        const Y = {
		fills: [	
			90, 90, 90, 90,
			180, 180, 180, 180,
			135, 225, 225, 135,
			0, 225, 225, 0,
			0, 180, 180, 0,
			0, 90, 90, 0
		],
		rotations: [
			90, 180, 90, 180,
			0, 180, 0, 180,
			0, 135, 0, 225,
			0, -45, 180, 0,
			0, 0, 180, 0,
			0, 0, -90, 0,
		],
        };

        const blank = {
	    fills: Array.from(Array(M)).map(() => 0),
	    rotations: Array.from(Array(M)).map(() => 0),
        };

	function render(config) {
            pixels.forEach((pixel, i) => {
                pixel.style.setProperty('--fill-angle', `${config.fills[i]}deg`);
		if ((config.fills[i] % 360) !== 0) {
                	pixel.style.transform = `rotate(${config.rotations[i]}deg)`;
	    	}
            });
        }
	let i = 0
	genuary = [blank, G, E, N, U, A, R, Y]
        setInterval(() => {
		render(genuary[i])
		i = (i + 1) % genuary.length
        }, 1000);

        render(genuary[0]);

    </script>
</body>
</html>
